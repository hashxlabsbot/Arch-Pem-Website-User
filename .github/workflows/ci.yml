name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arcpem
          POSTGRES_PASSWORD: arcpem
          POSTGRES_DB: accounts
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arcpem -d accounts" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://arcpem:arcpem@localhost:5432/accounts?schema=public
      DIRECT_URL: postgresql://arcpem:arcpem@localhost:5432/accounts?schema=public
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ci-only-secret-not-for-production-use-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The build renders pages that read plans and posts. This schema only mirrors the admin app's, so it is pushed
      # here ONLY into this run's empty throwaway database; never run db push against a real one (see schema.prisma).
      - name: Create the tables in the throwaway CI database
        run: npx prisma db push --skip-generate
      - run: npm run build
