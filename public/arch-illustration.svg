<svg viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="buildGlow" x="-4%" y="-4%" width="108%" height="108%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="rgba(99,102,241,0.07)" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(99,102,241,0)"/>
      <stop offset="30%" stop-color="rgba(99,102,241,0.35)"/>
      <stop offset="70%" stop-color="rgba(99,102,241,0.35)"/>
      <stop offset="100%" stop-color="rgba(99,102,241,0)"/>
    </linearGradient>
    <linearGradient id="buildFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(59,130,246,0.07)"/>
      <stop offset="100%" stop-color="rgba(99,102,241,0.03)"/>
    </linearGradient>
    <linearGradient id="winNorm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(99,102,241,0.18)"/>
      <stop offset="100%" stop-color="rgba(59,130,246,0.08)"/>
    </linearGradient>
    <linearGradient id="winHi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(59,130,246,0.45)"/>
      <stop offset="100%" stop-color="rgba(99,102,241,0.22)"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(99,102,241,0)"/>
      <stop offset="50%" stop-color="rgba(99,102,241,0.25)"/>
      <stop offset="100%" stop-color="rgba(99,102,241,0)"/>
    </linearGradient>
  </defs>

  <!-- background grid -->
  <rect width="480" height="260" fill="url(#grid)"/>

  <!-- ambient glow behind building -->
  <ellipse cx="240" cy="128" rx="120" ry="105" fill="rgba(59,130,246,0.05)"/>

  <!-- tech frame corners -->
  <polyline points="22,36 22,12 46,12" fill="none" stroke="rgba(99,102,241,0.5)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="458,36 458,12 434,12" fill="none" stroke="rgba(99,102,241,0.5)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="22,224 22,248 46,248" fill="none" stroke="rgba(99,102,241,0.5)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="458,224 458,248 434,248" fill="none" stroke="rgba(99,102,241,0.5)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- building depth shadow -->
  <rect x="146" y="26" width="200" height="208" rx="2" fill="rgba(0,0,40,0.28)"/>

  <!-- building body -->
  <rect x="140" y="22" width="200" height="210" fill="url(#buildFill)" rx="2"/>
  <rect x="140" y="22" width="200" height="210" fill="none" stroke="rgba(99,102,241,0.55)" stroke-width="1.5" rx="2" filter="url(#buildGlow)"/>

  <!-- floor slabs: y = 22,57,92,127,162,197,232 -->
  <line x1="140" y1="57"  x2="340" y2="57"  stroke="rgba(99,102,241,0.22)" stroke-width="0.75"/>
  <line x1="140" y1="92"  x2="340" y2="92"  stroke="rgba(99,102,241,0.22)" stroke-width="0.75"/>
  <!-- F3 active slab: highlighted -->
  <line x1="140" y1="127" x2="340" y2="127" stroke="rgba(59,130,246,0.5)"  stroke-width="1.2"  filter="url(#glow)"/>
  <line x1="140" y1="162" x2="340" y2="162" stroke="rgba(99,102,241,0.22)" stroke-width="0.75"/>
  <!-- ground floor separator -->
  <line x1="140" y1="197" x2="340" y2="197" stroke="rgba(99,102,241,0.38)" stroke-width="1"/>

  <!-- interior structural columns -->
  <line x1="200" y1="22" x2="200" y2="232" stroke="rgba(99,102,241,0.14)" stroke-width="0.75"/>
  <line x1="280" y1="22" x2="280" y2="232" stroke="rgba(99,102,241,0.14)" stroke-width="0.75"/>

  <!-- WINDOWS — 4 cols (x=154,201,248,295 w=30) × 5 residential floors -->
  <!-- F1: window_y=29 -->
  <rect x="154" y="29" width="30" height="22" rx="2" fill="url(#winNorm)" stroke="rgba(99,102,241,0.3)"  stroke-width="0.75"/>
  <rect x="201" y="29" width="30" height="22" rx="2" fill="url(#winNorm)" stroke="rgba(99,102,241,0.3)"  stroke-width="0.75"/>
  <rect x="248" y="29" width="30" height="22" rx="2" fill="url(#winNorm)" stroke="rgba(99,102,241,0.3)"  stroke-width="0.75"/>
  <rect x="295" y="29" width="30" height="22" rx="2" fill="url(#winNorm)" stroke="rgba(99,102,241,0.3)"  stroke-width="0.75"/>
  <!-- F2: window_y=64 — one lit window -->
  <rect x="154" y="64" width="30" height="22" rx="2" fill="url(#winNorm)" stroke="rgba(99,102,241,0.3)"  stroke-width="0.75"/>
  <rect x="201" y="64" width="30" height="22" rx="2" fill="url(#winHi)"   stroke="rgba(59,130,246,0.65)" stroke-width="1"    filter="url(#glow)"/>
  <rect x="248" y="64" width="30" height="22" rx="2" fill="url(#winNorm)" stroke="rgba(99,102,241,0.3)"  stroke-width="0.75"/>
  <rect x="295" y="64" width="30" height="22" rx="2" fill="url(#winNorm)" stroke="rgba(99,102,241,0.3)"  stroke-width="0.75"/>
  <!-- F3: highlighted floor, window_y=99 -->
  <rect x="140" y="92"  width="200" height="35" fill="rgba(59,130,246,0.05)"/>
  <rect x="154" y="99" width="30" height="22" rx="2" fill="url(#winHi)"   stroke="rgba(59,130,246,0.55)" stroke-width="1"/>
  <rect x="201" y="99" width="30" height="22" rx="2" fill="url(#winHi)"   stroke="rgba(59,130,246,0.55)" stroke-width="1"/>
  <rect x="248" y="99" width="30" height="22" rx="2" fill="url(#winHi)"   stroke="rgba(59,130,246,0.55)" stroke-width="1"/>
  <rect x="295" y="99" width="30" height="22" rx="2" fill="url(#winHi)"   stroke="rgba(59,130,246,0.55)" stroke-width="1"/>
  <!-- F3 active label -->
  <rect x="308" y="102" width="20" height="12" rx="3" fill="rgba(59,130,246,0.55)" filter="url(#glow)"/>
  <text x="318" y="112" text-anchor="middle" fill="white" font-size="6" font-weight="700">3F</text>
  <!-- F4: window_y=134 -->
  <rect x="154" y="134" width="30" height="22" rx="2" fill="url(#winNorm)" stroke="rgba(99,102,241,0.3)"  stroke-width="0.75"/>
  <rect x="201" y="134" width="30" height="22" rx="2" fill="url(#winNorm)" stroke="rgba(99,102,241,0.3)"  stroke-width="0.75"/>
  <rect x="248" y="134" width="30" height="22" rx="2" fill="url(#winNorm)" stroke="rgba(99,102,241,0.3)"  stroke-width="0.75"/>
  <rect x="295" y="134" width="30" height="22" rx="2" fill="url(#winNorm)" stroke="rgba(99,102,241,0.3)"  stroke-width="0.75"/>
  <!-- F5: window_y=169 -->
  <rect x="154" y="169" width="30" height="22" rx="2" fill="url(#winNorm)" stroke="rgba(99,102,241,0.3)"  stroke-width="0.75"/>
  <rect x="201" y="169" width="30" height="22" rx="2" fill="url(#winNorm)" stroke="rgba(99,102,241,0.3)"  stroke-width="0.75"/>
  <rect x="248" y="169" width="30" height="22" rx="2" fill="url(#winNorm)" stroke="rgba(99,102,241,0.3)"  stroke-width="0.75"/>
  <rect x="295" y="169" width="30" height="22" rx="2" fill="url(#winNorm)" stroke="rgba(99,102,241,0.3)"  stroke-width="0.75"/>
  <!-- Ground floor: 2 side windows + central arch entrance -->
  <rect x="154" y="204" width="30" height="22" rx="2" fill="url(#winNorm)" stroke="rgba(99,102,241,0.3)"  stroke-width="0.75"/>
  <path d="M 208 232 L 208 211 Q 240 197 272 211 L 272 232" fill="rgba(59,130,246,0.1)" stroke="rgba(99,102,241,0.5)" stroke-width="1.2"/>
  <line x1="240" y1="215" x2="240" y2="232" stroke="rgba(99,102,241,0.28)" stroke-width="0.75"/>
  <rect x="295" y="204" width="30" height="22" rx="2" fill="url(#winNorm)" stroke="rgba(99,102,241,0.3)"  stroke-width="0.75"/>

  <!-- roof parapet -->
  <rect x="136" y="15" width="208" height="9" rx="2" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.5)" stroke-width="1.2"/>
  <!-- rooftop AC units -->
  <rect x="168" y="5"  width="28" height="12" rx="3" fill="none" stroke="rgba(99,102,241,0.32)" stroke-width="0.75"/>
  <rect x="248" y="3"  width="28" height="12" rx="3" fill="none" stroke="rgba(99,102,241,0.32)" stroke-width="0.75"/>
  <!-- antenna -->
  <line x1="240" y1="15" x2="240" y2="0" stroke="rgba(99,102,241,0.4)" stroke-width="0.75" stroke-dasharray="2.5,2"/>
  <circle cx="240" cy="-1" r="2.8" fill="#6366f1" filter="url(#glow2)"/>
  <circle cx="240" cy="-1" r="2.8" fill="#a78bfa"/>

  <!-- GLOW NODES at structural intersections -->
  <circle cx="140" cy="22"  r="3"   fill="#3b82f6" filter="url(#glow2)"/>
  <circle cx="340" cy="22"  r="3"   fill="#3b82f6" filter="url(#glow2)"/>
  <circle cx="140" cy="232" r="2.8" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="340" cy="232" r="2.8" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="140" cy="57"  r="2"   fill="#6366f1" opacity="0.75"/>
  <circle cx="340" cy="57"  r="2"   fill="#6366f1" opacity="0.75"/>
  <circle cx="140" cy="92"  r="2"   fill="#6366f1" opacity="0.75"/>
  <circle cx="340" cy="92"  r="2"   fill="#6366f1" opacity="0.75"/>
  <circle cx="140" cy="127" r="3"   fill="#60a5fa" filter="url(#glow)"/>
  <circle cx="340" cy="127" r="3"   fill="#60a5fa" filter="url(#glow)"/>
  <circle cx="140" cy="162" r="2"   fill="#6366f1" opacity="0.75"/>
  <circle cx="340" cy="162" r="2"   fill="#6366f1" opacity="0.75"/>
  <circle cx="140" cy="197" r="2"   fill="#6366f1" opacity="0.75"/>
  <circle cx="340" cy="197" r="2"   fill="#6366f1" opacity="0.75"/>

  <!-- ground line -->
  <line x1="78"  y1="232" x2="402" y2="232" stroke="url(#groundGrad)" stroke-width="1"/>
  <circle cx="78"  cy="232" r="1.5" fill="rgba(99,102,241,0.4)"/>
  <circle cx="402" cy="232" r="1.5" fill="rgba(99,102,241,0.4)"/>

  <!-- scanning line at active floor level -->
  <rect x="0" y="127" width="480" height="1" fill="url(#scanGrad)" opacity="0.65"/>

  <!-- DIMENSION LINE — height (left side) -->
  <line x1="116" y1="22"  x2="116" y2="232" stroke="rgba(255,255,255,0.09)" stroke-width="0.75" stroke-dasharray="4,3"/>
  <line x1="110" y1="22"  x2="122" y2="22"  stroke="rgba(255,255,255,0.14)" stroke-width="0.75"/>
  <line x1="110" y1="232" x2="122" y2="232" stroke="rgba(255,255,255,0.14)" stroke-width="0.75"/>
  <text x="105" y="130" fill="rgba(255,255,255,0.18)" font-size="7" font-family="monospace" text-anchor="middle" transform="rotate(-90,105,130)">21.0 m</text>

  <!-- DIMENSION LINE — width (below) -->
  <line x1="140" y1="242" x2="340" y2="242" stroke="rgba(255,255,255,0.09)" stroke-width="0.75" stroke-dasharray="4,3"/>
  <line x1="140" y1="238" x2="140" y2="246" stroke="rgba(255,255,255,0.14)" stroke-width="0.75"/>
  <line x1="340" y1="238" x2="340" y2="246" stroke="rgba(255,255,255,0.14)" stroke-width="0.75"/>
  <text x="240" y="252" fill="rgba(255,255,255,0.18)" font-size="7" font-family="monospace" text-anchor="middle">18.0 m</text>

  <!-- LEFT FLOATING CARD — Structure -->
  <rect x="10" y="78" width="116" height="80" rx="8" fill="rgba(6,10,24,0.88)" stroke="rgba(99,102,241,0.32)" stroke-width="1"/>
  <rect x="10" y="78" width="116" height="20" rx="8" fill="rgba(99,102,241,0.22)"/>
  <rect x="10" y="88"  width="116" height="10" fill="rgba(99,102,241,0.22)"/>
  <circle cx="22"  cy="88" r="3.5" fill="#6366f1" filter="url(#glow)"/>
  <text x="31" y="93" fill="rgba(255,255,255,0.68)" font-size="7.5" font-weight="700" letter-spacing="0.8">STRUCTURE</text>
  <text x="18" y="115" fill="rgba(255,255,255,0.38)" font-size="7">Floors</text>
  <text x="120" y="115" text-anchor="end" fill="#60a5fa" font-size="8" font-weight="700">6 floors</text>
  <text x="18" y="130" fill="rgba(255,255,255,0.38)" font-size="7">Built Area</text>
  <text x="120" y="130" text-anchor="end" fill="#60a5fa" font-size="8" font-weight="700">3,140 sqft</text>
  <text x="18" y="145" fill="rgba(255,255,255,0.38)" font-size="7">Frame</text>
  <text x="120" y="145" text-anchor="end" fill="#a78bfa" font-size="8" font-weight="700">RCC Frame</text>
  <!-- connector to building -->
  <line x1="126" y1="128" x2="140" y2="128" stroke="rgba(99,102,241,0.45)" stroke-width="0.8" stroke-dasharray="3,2.5"/>
  <circle cx="140" cy="128" r="2.5" fill="#6366f1" filter="url(#glow)"/>

  <!-- RIGHT FLOATING CARD — Estimate -->
  <rect x="350" y="58" width="122" height="92" rx="8" fill="rgba(6,10,24,0.88)" stroke="rgba(59,130,246,0.32)" stroke-width="1"/>
  <rect x="350" y="58" width="122" height="20" rx="8" fill="rgba(59,130,246,0.2)"/>
  <rect x="350" y="68"  width="122" height="10" fill="rgba(59,130,246,0.2)"/>
  <circle cx="362" cy="68" r="3.5" fill="#3b82f6" filter="url(#glow)"/>
  <text x="371" y="73" fill="rgba(255,255,255,0.68)" font-size="7.5" font-weight="700" letter-spacing="0.8">BOQ ESTIMATE</text>
  <text x="358" y="98"  fill="rgba(255,255,255,0.38)" font-size="7">Civil Works</text>
  <text x="466" y="98"  text-anchor="end" fill="#34d399" font-size="7.5" font-weight="700">&#8377;4.21L</text>
  <text x="358" y="113" fill="rgba(255,255,255,0.38)" font-size="7">MEP</text>
  <text x="466" y="113" text-anchor="end" fill="#34d399" font-size="7.5" font-weight="700">&#8377;1.80L</text>
  <text x="358" y="128" fill="rgba(255,255,255,0.38)" font-size="7">Finishes</text>
  <text x="466" y="128" text-anchor="end" fill="#34d399" font-size="7.5" font-weight="700">&#8377;2.11L</text>
  <line x1="358" y1="134" x2="466" y2="134" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <text x="358" y="145" fill="rgba(255,255,255,0.55)" font-size="7.5" font-weight="700">Total + GST</text>
  <text x="466" y="145" text-anchor="end" fill="white" font-size="10" font-weight="900">&#8377;9.49L</text>
  <!-- connector to building -->
  <line x1="340" y1="92" x2="350" y2="92" stroke="rgba(59,130,246,0.45)" stroke-width="0.8" stroke-dasharray="3,2.5"/>
  <circle cx="340" cy="92" r="2.5" fill="#3b82f6" filter="url(#glow)"/>

  <!-- BOTTOM STATUS BAR -->
  <rect x="140" y="240" width="200" height="17" rx="5" fill="rgba(6,10,24,0.75)" stroke="rgba(99,102,241,0.22)" stroke-width="0.75"/>
  <rect x="147" y="246" width="112" height="5" rx="2.5" fill="rgba(99,102,241,0.15)"/>
  <rect x="147" y="246" width="90"  height="5" rx="2.5" fill="rgba(99,102,241,0.65)"/>
  <circle cx="237" cy="248.5" r="2.5" fill="#60a5fa" filter="url(#glow)"/>
  <text x="271" y="251" fill="rgba(255,255,255,0.35)" font-size="6.5" font-family="monospace">Estimate · 80%</text>

  <!-- ambient floating nodes -->
  <circle cx="66"  cy="52"  r="1.5" fill="rgba(99,102,241,0.4)"/>
  <circle cx="414" cy="178" r="1.5" fill="rgba(59,130,246,0.4)"/>
  <circle cx="73"  cy="192" r="1.2" fill="rgba(99,102,241,0.32)"/>
  <circle cx="420" cy="56"  r="1.2" fill="rgba(59,130,246,0.32)"/>
  <circle cx="50"  cy="143" r="1.2" fill="rgba(139,92,246,0.38)"/>
  <circle cx="432" cy="143" r="1.2" fill="rgba(139,92,246,0.38)"/>
  <circle cx="88"  cy="230" r="1"   fill="rgba(99,102,241,0.28)"/>
  <circle cx="392" cy="230" r="1"   fill="rgba(99,102,241,0.28)"/>
</svg>
