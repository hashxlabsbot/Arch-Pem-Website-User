<svg width="200" height="52" viewBox="0 0 200 52" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Mark: deep-space base gradient -->
    <linearGradient id="mk-bg" x1="0" y1="0" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#080d1c"/>
      <stop offset="48%"  stop-color="#18276a"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>

    <!-- Mark: top-left specular gloss -->
    <radialGradient id="mk-gl" cx="34%" cy="20%" r="62%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.26)"/>
      <stop offset="55%"  stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- Mark: bottom inner depth shadow -->
    <radialGradient id="mk-dp" cx="50%" cy="105%" r="68%">
      <stop offset="0%"   stop-color="rgba(0,0,0,0.32)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>

    <!-- Mark: edge border gradient -->
    <linearGradient id="mk-ed" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="rgba(147,197,253,0.65)"/>
      <stop offset="45%"  stop-color="rgba(99,102,241,0.18)"/>
      <stop offset="100%" stop-color="rgba(8,13,28,0.08)"/>
    </linearGradient>

    <!-- Mark: electric cyan beam -->
    <linearGradient id="mk-bm" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="rgba(147,197,253,0.4)"/>
      <stop offset="50%"  stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="rgba(147,197,253,0.4)"/>
    </linearGradient>

    <!-- Wordmark: "ARC" gradient -->
    <linearGradient id="wm-arc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Wordmark: "PEM" gradient -->
    <linearGradient id="wm-pem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Glow filter for the A mark -->
    <filter id="mk-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop shadow for the whole mark -->
    <filter id="mk-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(55,48,163,0.45)"/>
    </filter>
  </defs>

  <!-- ══ MARK (52×52) ══ -->
  <g filter="url(#mk-shadow)">
    <!-- Base shape -->
    <rect width="52" height="52" rx="13.5" fill="url(#mk-bg)"/>
    <!-- Depth shadow at bottom -->
    <rect width="52" height="52" rx="13.5" fill="url(#mk-dp)"/>
    <!-- Glossy top shine -->
    <rect width="52" height="52" rx="13.5" fill="url(#mk-gl)"/>
    <!-- Edge highlight border -->
    <rect x="0.5" y="0.5" width="51" height="51" rx="13" fill="none" stroke="url(#mk-ed)" stroke-width="1"/>
  </g>

  <!-- "A" architectural mark -->
  <g filter="url(#mk-glow)">
    <path d="M 12.5 43.5 L 26 10.5" stroke="rgba(255,255,255,0.95)" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 26 10.5 L 39.5 43.5" stroke="rgba(255,255,255,0.95)" stroke-width="3.2" stroke-linecap="round"/>
  </g>
  <!-- Electric cyan cross-beam -->
  <path d="M 18.5 33 L 33.5 33" stroke="url(#mk-bm)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Ground base line -->
  <path d="M 7.5 45.5 L 44.5 45.5" stroke="rgba(147,197,253,0.22)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- ══ WORDMARK ══ -->
  <!-- "ARC" -->
  <text
    x="66" y="24"
    font-family="'Poppins', 'Inter', system-ui, sans-serif"
    font-weight="800"
    font-size="18"
    letter-spacing="2.5"
    fill="url(#wm-arc)"
  >ARC</text>

  <!-- Separator dot -->
  <circle cx="137" cy="19" r="2" fill="rgba(99,102,241,0.4)"/>

  <!-- "PEM" -->
  <text
    x="66" y="41"
    font-family="'Poppins', 'Inter', system-ui, sans-serif"
    font-weight="700"
    font-size="15"
    letter-spacing="3.5"
    fill="url(#wm-pem)"
  >PEM</text>

  <!-- Accent underline under PEM -->
  <rect x="66" y="44" width="62" height="1.5" rx="1" fill="url(#wm-pem)" opacity="0.3"/>

  <!-- Tagline -->
  <text
    x="66" y="50"
    font-family="'Inter', system-ui, sans-serif"
    font-weight="500"
    font-size="6.5"
    letter-spacing="1.8"
    fill="#94a3b8"
  >CONSTRUCTION FINANCE</text>
</svg>
